const diffColors = {
  easy:{bg:'#EAF3DE',color:'#27500A',label:'Easy — skim fast'},
  medium:{bg:'#E6F1FB',color:'#0C447C',label:'Medium — steady pace'},
  hard:{bg:'#FAECE7',color:'#712B13',label:'Hard — slow down'},
  strategic:{bg:'#EEEDFE',color:'#3C3489',label:'Strategic — ongoing'},
};

let activePhase = 'p1';

function render(){
  const nav = document.getElementById('nav');
  const phasesEl = document.getElementById('phases');
  const obBar = document.getElementById('overall-bar');

  obBar.innerHTML = phases.map((p,i)=>`<div class="ob-seg" style="background:${p.color};opacity:${activePhase===p.id?1:0.25}" title="${p.label}"></div>`).join('');

  nav.innerHTML = phases.map(p=>`<button class="nav-btn${activePhase===p.id?' active':''}" onclick="setPhase('${p.id}')">${p.label}</button>`).join('');

  phasesEl.innerHTML = phases.map(p=>`
    <div class="phase${activePhase===p.id?' active':''}" id="${p.id}">
      <div class="phase-header">
        <div>
          <div class="phase-pill" style="background:${p.bg};color:${p.textColor}">${p.weeks}</div>
        </div>
        <div class="phase-info">
          <h2>${p.label}</h2>
          <p>${p.desc}</p>
          <div class="timeline-bar">
            <div class="tbar-track"><div class="tbar-fill" style="background:${p.color};width:${Math.min(100,p.timeWeight/2*100)}%"></div></div>
            <span class="tbar-label">${diffColors[p.difficulty]?.label||p.difficulty}</span>
          </div>
        </div>
      </div>
      <div class="sections">
        ${p.sections.map((s,si)=>`
          <div class="section">
            <div class="section-head" onclick="toggleSection('${p.id}-${si}')">
              <div class="section-dot" style="background:${s.dot}"></div>
              <span class="section-title">${s.title}</span>
              <div class="section-meta">
                <span class="diff-badge" style="background:${diffColors[s.diff]?.bg};color:${diffColors[s.diff]?.color}">${s.diff}</span>
                <span class="time-badge">${s.time}</span>
              </div>
              <span class="chevron" id="chev-${p.id}-${si}">▶</span>
            </div>
            <div class="section-body" id="body-${p.id}-${si}">
              <div class="why-box">Why this matters: ${s.why}</div>
              <div class="topics-grid">
                ${s.topics.map(t=>`
                  <div class="topic-item${t.k?' know':''}">
                    <div class="topic-dot" style="background:${t.k?'#639922':s.dot}"></div>
                    <span>${t.t}${t.k?' (you know this)':''}</span>
                  </div>
                `).join('')}
              </div>
              <div class="res-row">
                ${s.resources.map(r=>`<a class="res-chip" href="${r.url}" target="_blank">${r.label}</a>`).join('')}
              </div>
              <button class="ask-btn" onclick="sendPrompt('Teach me ${s.title} in detail with examples')">Deep dive: ${s.title} ↗</button>
            </div>
          </div>
        `).join('')}
      </div>
      <div class="footer-nav">
        ${phases.findIndex(p2=>p2.id===p.id)>0?`<button class="fnav-btn" onclick="setPhase('${phases[phases.findIndex(p2=>p2.id===p.id)-1].id}')">← Previous</button>`:'<span></span>'}
        ${phases.findIndex(p2=>p2.id===p.id)<phases.length-1?`<button class="fnav-btn" onclick="setPhase('${phases[phases.findIndex(p2=>p2.id===p.id)+1].id}')">Next →</button>`:'<span style="font-size:12px;color:var(--color-text-tertiary)">All phases covered</span>'}
      </div>
    </div>
  `).join('');
}

function setPhase(id){
  activePhase=id;
  render();
  document.getElementById('nav').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function toggleSection(key){
  const body = document.getElementById('body-'+key);
  const chev = document.getElementById('chev-'+key);
  const open = body.classList.toggle('open');
  chev.classList.toggle('open',open);
}

render();
</script>
